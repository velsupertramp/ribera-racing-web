<script id="rr-bootstrap96">
// Este arranque pequeño sigue visible si falla la descarga o evaluación del módulo.
(function () {
  var boot = document.getElementById('rr-boot');
  var message = document.getElementById('rr-boot-message');
  var help = document.getElementById('rr-boot-help');
  var retry = document.getElementById('rr-boot-retry');
  var detail = document.getElementById('rr-boot-detail');
  var started = Date.now();
  var settled = false;
  var gameURL = new URL('game.js?v=720eb24f2292faf4', document.baseURI).href;
  var state = window.__RR_BOOT96 = { phase: 'loading', elapsedMs: 0, gameURL: gameURL, error: null };
  retry.addEventListener('click', function () { retry.disabled = true; location.reload(); });
  function show(phase, title, explanation, error) {
    state.phase = phase;
    state.elapsedMs = Date.now() - started;
    state.error = error ? String(error.message || error) : null;
    if (!boot.isConnected) document.body.appendChild(boot);
    boot.setAttribute('data-phase', phase);
    message.textContent = title;
    help.textContent = explanation;
    retry.hidden = false;
    if (state.error) { detail.hidden = false; detail.textContent = state.error.slice(0, 220); }
  }
  // No es un porcentaje de descarga. Si la red o el módulo se quedan pendientes,
  // ofrecemos un reintento; una carga tardía aún puede completar el arranque.
  var watchdog = setInterval(function () {
    if (!settled && Date.now() - lastProgress > 30000) { clearInterval(watchdog); show('slow', 'El juego está tardando en abrir.', 'La conexión va muy lenta. Puedes volver a intentarlo; si la descarga termina, el menú aparecerá aquí.', null); }
  }, 5000);
  // rr-progreso-f9: descarga con avance; el módulo se importa después desde la caché (game.js es inmutable).
  var expectedBytes = 7838818 /*rr-bytes-f9*/, lastProgress = Date.now();
  function descarga() {
    if (!window.fetch || !window.ReadableStream || !expectedBytes) return Promise.resolve();
    return fetch(gameURL).then(function (r) {
      if (!r.ok || !r.body) return;
      var reader = r.body.getReader(), got = 0;
      function pump() { return reader.read().then(function (x) { if (x.done) return; got += x.value.length; lastProgress = Date.now();
        message.textContent = 'Descargando el juego… ' + Math.min(99, Math.round(got * 100 / expectedBytes)) + ' %'; return pump(); }); }
      return pump();
    }).catch(function () { /* el import lo vuelve a intentar */ });
  }
  descarga().then(function () { message.textContent = 'Preparando la portada…'; help.textContent = 'Ya está descargado; falta montarlo.'; lastProgress = Date.now(); return import(gameURL); }).then(function () {
    settled = true;
    clearInterval(watchdog);
    state.phase = 'ready';
    state.elapsedMs = Date.now() - started;
    state.error = null;
    boot.remove();
  }).catch(function (error) {
    settled = true;
    clearInterval(watchdog);
    show('error', 'No se ha podido abrir el juego.', 'Vuelve a intentarlo. Si vuelve a fallar, envía el mensaje de abajo para revisarlo.', error);
    console.error('[Ribera Racing boot96]', error);
  });
}());
</script>
